# ---------------------------------------------------------------
# File:     shellcheck.yml
# Purpose:  Lint every tracked shell script with a pinned ShellCheck release
# Project:  sgt7 Linux setup repositories
# Author:   sgt7 LLC
# ---------------------------------------------------------------

name: ShellCheck

on:
  push:
  pull_request:

# SECURITY: The job only reads the repository, so the token gets no write scopes.
permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    env:
      SHELLCHECK_VERSION: "v0.11.0"
      # SECURITY: Checksum of the release archive, so a changed download fails the job.
      SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
    steps:
      # SECURITY: Pinned to the commit SHA of actions/checkout v7.0.1, because tags can be moved.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install ShellCheck
        run: |
          archive="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSLO "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${archive}"
          echo "${SHELLCHECK_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xJf "${archive}"
          sudo install -m 0755 "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: Run ShellCheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -x
